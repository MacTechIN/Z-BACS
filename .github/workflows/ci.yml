# Z-0.D.3 CI skeleton. Jobs for contracts/ and packages/ are skipped until those directories exist.
name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
permissions:
  contents: read

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # zbacs-auth's Linux keychain backend (keyring `sync-secret-service`) links libdbus.
      - name: system libraries (dbus for the Linux keychain)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: test (debug)
        run: cargo test --workspace --locked
      - name: test (release, perf gate)
        # `--include-ignored`: the perf tests are #[ignore] so a debug run skips them, and
        # without this flag the filter matched nothing and the gate silently passed.
        run: cargo test --workspace --release --locked -- --include-ignored perf_
      - name: docs (public API must be documented)
        if: matrix.os == 'ubuntu-latest'
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: coverage gate (zbacs-core, zbacs-auth >= 90% lines)
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: coverage gate run
        if: matrix.os == 'ubuntu-latest'
        run: cargo llvm-cov -p zbacs-core -p zbacs-auth --locked --fail-under-lines 90
      - name: audit
        if: matrix.os == 'ubuntu-latest'
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  contracts:
    name: foundry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - id: present
        run: echo "yes=$([ -f contracts/foundry.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: foundry-rs/foundry-toolchain@v1
        if: steps.present.outputs.yes == 'true'
      - name: forge fmt / build / test
        if: steps.present.outputs.yes == 'true'
        working-directory: contracts
        run: |
          forge fmt --check
          forge build --sizes
      # zbacs-chain compiles against checked-in copies of these artifacts (crates/zbacs-chain/abi).
      # A contract change must ship with refreshed copies: tools/chain-it.sh does that.
      - name: abi copies in sync
        if: steps.present.outputs.yes == 'true'
        working-directory: contracts
        run: |
          for name in FileRegistry AccessPolicy AuditLog P256Validator ERC1967Proxy; do
            if ! diff <(jq -S .abi "out/$name.sol/$name.json") <(jq -S .abi "../crates/zbacs-chain/abi/$name.json") >/dev/null; then
              echo "::error::crates/zbacs-chain/abi/$name.json is stale — run tools/chain-it.sh and commit"
              exit 1
            fi
          done
          forge test -vvv
          forge coverage --ir-minimum --no-match-coverage script --report summary
      - name: chain integration (zbacs-chain against Anvil)
        # the step id is `present`; `steps.contracts` was empty, so this never ran
        if: steps.present.outputs.yes == 'true'
        run: cargo test -p zbacs-chain
      - name: deploy + walkthrough on a local chain (Z-1.H.4, and the AuditLog gas budget)
        if: steps.present.outputs.yes == 'true'
        run: tools/chain-demo.sh
      - name: skipped
        if: steps.present.outputs.yes != 'true'
        run: echo "contracts/ not present yet (Z-1.H.1)"

  agent:
    name: agent (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: apps/agent/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/agent/src-tauri
      - name: system libraries (webview)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev xvfb
      # The software signers stand in for Hello and the TPM on Linux; Windows uses the real ones.
      - name: features
        id: feat
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            echo "flags=--features demo-signer" >> "$GITHUB_OUTPUT"
          else
            echo "flags=" >> "$GITHUB_OUTPUT"
          fi
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked ${{ steps.feat.outputs.flags }}
      - run: cargo test --locked ${{ steps.feat.outputs.flags }}

  ux:
    name: ux lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # U-5 (no forbidden vocabulary), U-6 (no text input), rule 8 (tokens only), and the
      # UI's ids match its markup. See docs/design/ui_strings.md.
      - run: tools/ux-lint.sh

  node:
    name: node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: present
        run: echo "yes=$([ -f package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.present.outputs.yes == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.present.outputs.yes == 'true'
        run: |
          npm ci
          npm run lint --if-present
          npm test --if-present
      - if: steps.present.outputs.yes != 'true'
        run: echo "no package.json yet (Z-1.H.8)"

  docs:
    name: docs links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check relative markdown links
        run: |
          set -e
          fail=0
          while IFS= read -r f; do
            grep -oE '\]\(([^)#]+)' "$f" | sed 's/](//' | grep -vE '^(https?:|mailto:)' | while read -r l; do
              t="$(dirname "$f")/$(printf '%b' "${l//%/\\x}")"
              [ -e "$t" ] || { echo "broken link in $f: $l"; exit 1; }
            done || fail=1
          done < <(find docs CLAUDE.md -name '*.md')
          exit $fail
