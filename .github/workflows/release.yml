# Z-1.S.3 — installer for testers who must not need cargo, node or a terminal.
# Builds the Windows NSIS installer for the Agent plus zbacs-wincheck.exe, publishes them as
# a workflow artifact on every run, and as a GitHub Release when a v* tag is pushed.
name: release
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
permissions:
  contents: write

jobs:
  windows:
    name: installer (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/agent/src-tauri
      # Prebuilt tauri-cli: `cargo install` would spend ~10 minutes compiling it.
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall -y tauri-cli --version "^2"

      # Z-1.H.11: the installer carries the relay, the chain and the contract addresses so a
      # tester never types a server. Repository variables (Settings → Variables) hold the
      # public values; the bundler URL is a secret because Pimlico's key is part of it. Unset
      # means "not embedded" and the Agent falls back to its developer defaults (README).
      - name: agent installer (NSIS, per-user install, .zbacs association)
        working-directory: apps/agent/src-tauri
        env:
          ZBACS_BUILD_RELAY_URL: ${{ vars.ZBACS_RELAY_URL }}
          ZBACS_BUILD_CHAIN_RPC: ${{ vars.ZBACS_CHAIN_RPC }}
          ZBACS_BUILD_BUNDLER_URL: ${{ secrets.ZBACS_BUNDLER_URL }}
          ZBACS_BUILD_PAYMASTER_POLICY: ${{ vars.ZBACS_PAYMASTER_POLICY }}
          ZBACS_CHAIN_ID: ${{ vars.ZBACS_CHAIN_ID }}
        shell: bash
        run: |
          if [ -n "$ZBACS_CHAIN_ID" ] && [ -f "../../../contracts/deployments/$ZBACS_CHAIN_ID.json" ]; then
            export ZBACS_BUILD_DEPLOYMENT="$(pwd)/../../../contracts/deployments/$ZBACS_CHAIN_ID.json"
            echo "embedding contracts/deployments/$ZBACS_CHAIN_ID.json"
          fi
          cargo tauri build --bundles nsis

      - name: zbacs-wincheck.exe (hardware self-test, docs/windows_checklist.md §1)
        run: cargo build --release -p zbacs-wincheck --locked

      # Z-1.Q.4: what is inside the installer, as a bill of materials (both lockfiles and the
      # contract dependencies), shipped next to it.
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/zbacs-sbom.spdx.json
          upload-artifact: false

      - name: collect
        shell: bash
        run: |
          mkdir -p dist
          cp apps/agent/src-tauri/target/release/bundle/nsis/*-setup.exe dist/
          cp target/release/zbacs-wincheck.exe dist/
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: zbacs-windows-${{ github.sha }}
          path: dist/*
          if-no-files-found: error

      - name: GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: apps/agent/release-notes.md
