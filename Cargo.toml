[workspace]
resolver = "2"
members = ["crates/zbacs-core", "crates/zbacs-cli", "crates/zbacs-auth", "crates/zbacs-proto", "crates/zbacs-wincheck"]
exclude = ["spikes/*", "crates/zbacs-core/fuzz"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/MacTechIN/Z-BACS"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
ciborium = "0.2"
rand = "0.8"
sha2 = "0.10"
blake3 = "1"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hpke-rs = "0.7"
hpke-rs-crypto = "0.7"
hpke-rs-rust-crypto = "0.7"
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = { version = "1", features = ["derive"] }
secrecy = "0.10"
hex = "0.4"
p256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
serde_json = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
