[package]
name = "zbacs-agent"
version = "0.0.1"
edition = "2021"
description = "Z-BACS Agent: seals files, asks the owner for approval, opens what was approved"
license = "Apache-2.0"

# Standalone workspace: the webview toolchain is heavy and pulls system libraries, so it stays
# out of the root workspace and its CI job (the spike does the same).
[workspace]

[lib]
name = "zbacs_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# The keychain is on everywhere: without it the device would have to set itself up again on
# every launch. `OsKeyStore::available()` still decides at runtime whether one is reachable.
default = ["os-keystore"]
# Software stand-in signers so the Agent runs on a developer box with no TPM and no Windows
# Hello. Never enabled in a release build: the approval key would be ordinary process memory.
demo-signer = ["zbacs-auth/software-signer"]
# The OS keychain (Credential Manager / Keychain / Secret Service).
os-keystore = ["zbacs-auth/os-keystore"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
# The one webview capability beyond events: choosing a file to lock. Dropping a file works
# without it, but a person who cannot drag needs a way in too.
tauri-plugin-dialog = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
zbacs-core = { path = "../../../crates/zbacs-core" }
zbacs-session = { path = "../../../crates/zbacs-session" }
zbacs-auth = { path = "../../../crates/zbacs-auth", default-features = false }

[target.'cfg(windows)'.dependencies]
# Windows Hello and the TPM device key: the two real signer paths (ADR-0006).
zbacs-auth = { path = "../../../crates/zbacs-auth", features = ["windows-hardware", "os-keystore"] }
