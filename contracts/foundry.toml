[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [
    { access = "read-write", path = "./out" },
    # Z-1.H.4 writes deployments/<chainId>.json — the one place addresses are recorded.
    { access = "read-write", path = "./deployments" },
]

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"

[rpc_endpoints]
anvil = "http://127.0.0.1:8545"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

[fuzz]
runs = 512

# Z-1.H.5 invariants (test/Invariants.t.sol): enough to reach every handler path in a few
# seconds of CI; tools/fuzz.sh is where the long runs live.
[invariant]
runs = 64
depth = 48
fail_on_revert = true
