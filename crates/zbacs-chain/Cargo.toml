[package]
name = "zbacs-chain"
description = "Z-BACS chain client: contract bindings, event watching, offline cache (Z-1.H.7)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
alloy = { version = "2", features = ["full", "node-bindings", "json-rpc"] }
async-trait = "0.1"
# only for parsing the bundler URL; alloy's transport does the HTTP
reqwest_url = { package = "url", version = "2" }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["time", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"] }
# a stand-in bundler for the JSON-RPC tests
axum = "0.8"
