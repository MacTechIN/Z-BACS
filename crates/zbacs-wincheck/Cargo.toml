[package]
name = "zbacs-wincheck"
description = "Windows hardware self-test: Windows Hello, TPM device key, credential store, file association (Z-1.A.2/A.7/A.3, Z-0.G.1)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "zbacs-wincheck"
path = "src/main.rs"

[dependencies]
zbacs-auth = { path = "../zbacs-auth", features = ["software-signer", "os-keystore", "windows-hardware"] }
zbacs-core = { path = "../zbacs-core" }
hex.workspace = true
rand.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
] }
