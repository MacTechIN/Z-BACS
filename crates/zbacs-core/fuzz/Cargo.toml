[package]
name = "zbacs-core-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
zbacs-core = { path = ".." }

[[bin]]
name = "header"
path = "fuzz_targets/header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "header_signed"
path = "fuzz_targets/header_signed.rs"
test = false
doc = false
bench = false

[[bin]]
name = "open_mutated"
path = "fuzz_targets/open_mutated.rs"
test = false
doc = false
bench = false

[[bin]]
name = "envelope"
path = "fuzz_targets/envelope.rs"
test = false
doc = false
bench = false

[workspace]
