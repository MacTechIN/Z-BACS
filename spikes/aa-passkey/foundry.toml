[profile.default]
src = "src"
out = "out"
test = "test"
libs = ["../../contracts/lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# Fork tests read vectors/userop.json produced by scripts/kernel-account.mjs
fs_permissions = [{ access = "read", path = "./vectors" }]

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
